name: update-terminal-gif

on:
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  schedule:
    - cron: "0 0 * * *"     # refreshes once a day at midnight UTC

jobs:
  build:
    name: regenerate neofetch-style terminal gif
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate terminal.gif
        uses: liamg/github-profile-terminal-action@main
        with:
          # optional flavour text the "neofetch" panel can scroll through
          feed_url: ""
          twitter_username: ""
          theme: dark
          token: ${{ secrets.GITHUB_TOKEN }}
